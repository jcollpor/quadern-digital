<!DOCTYPE html>
<html lang="ca" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quadern Digital de Projecte - Enginyeria Biomèdica UOC</title>
    <style>
        /* ==========================================================================
           1. VARIABLES CSS (THEMING MODE FOSC / CLAR)
           ========================================================================== */
        :root {
            --bg-color: #f4f6f9;
            --surface-color: #ffffff;
            --text-color: #333333;
            --text-muted: #666666;
            --border-color: #e0e0e0;
            --primary-color: #004080;
            --primary-hover: #002b55;
            --accent-color: #73bda8;
            --danger-color: #d9534f;
            --warning-color: #f0ad4e;
            --success-color: #5cb85c;
            --info-color: #5bc0de;
            --shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            --radius: 8px;
        }

        [data-theme="dark"] {
            --bg-color: #121212;
            --surface-color: #1e1e2e;
            --text-color: #e0e0e0;
            --text-muted: #a0a0a0;
            --border-color: #333345;
            --primary-color: #3b82f6;
            --primary-hover: #2563eb;
            --accent-color: #34d399;
            --shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        /* Basic Reset & Base */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); transition: background-color 0.3s, color 0.3s; line-height: 1.6; }
        
        /* Layout Header */
        header { background-color: var(--primary-color); color: white; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; box-shadow: var(--shadow); }
        header h1 { font-size: 1.5rem; }
        .header-controls { display: flex; gap: 10px; align-items: center; }
        
        /* Buttons */
        .btn { padding: 0.5rem 1rem; border: none; border-radius: var(--radius); cursor: pointer; font-weight: 600; transition: background 0.2s; display: inline-flex; align-items: center; gap: 5px; }
        .btn-primary { background-color: var(--primary-color); color: white; }
        .btn-primary:hover { background-color: var(--primary-hover); }
        .btn-secondary { background-color: var(--surface-color); color: var(--text-color); border: 1px solid var(--border-color); }
        .btn-danger { background-color: var(--danger-color); color: white; }
        .btn-success { background-color: var(--success-color); color: white; }
        .btn-theme { background: transparent; color: white; border: 1px solid rgba(255,255,255,0.3); font-size: 1.2rem; padding: 0.3rem 0.6rem; }
